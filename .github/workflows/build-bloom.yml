name: Build Bloom

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

concurrency:
  group: build-bloom
  cancel-in-progress: false

jobs:
  build-bloom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run bloom:build
      - run: npm run bloom:publish:remote
